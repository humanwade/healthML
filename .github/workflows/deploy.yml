name: Deploy Calories Cut Project via Direct Cloudflare Tunnel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build WAR
        run: mvn clean package -DskipTests

      - name: Install cloudflared
        run: |
          curl -L -o cloudflared "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64"
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Cloudflare Access login
        env:
          CF_CLIENT_ID: ${{ secrets.CLOUDFLARE_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_CLIENT_SECRET }}
        run: |
          cloudflared access login --service-token-id "$CF_CLIENT_ID" --service-token-secret "$CF_CLIENT_SECRET"

      - name: Prepare SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "$SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Transfer WAR via Cloudflare Tunnel
        run: |
          scp -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              -i /tmp/deploy_key target/healthML-0.0.1.war \
              pi@ssh.wadeverse.net:~/healthML.war_temp

      - name: Restart PM2 on Pi
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              -i /tmp/deploy_key pi@ssh.wadeverse.net "
                mv ~/healthML.war_temp ~/healthML-0.0.1.war &&
                pm2 restart healthML || pm2 start 'java -jar ~/healthML-0.0.1.war' --name healthML
              "
