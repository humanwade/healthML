name: Deploy Calories Cut Project via Oracle VM

on:
  push:
    branches:
      - main # 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Github Action to VM(Oracl) 
      - name: Set up SSH Key for VM
        uses: webfactory/ssh-agent@v0.8.0
        with:
          # use private key
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          
      # 3. connect to VM and deploy
      - name: Deploy via Oracle VM to Raspberry Pi
        run: |
          echo "Connecting to Oracle VM..."
         
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            echo "Connected to Oracle VM"

            # 3-1. check the project and clone
            PROJECT_DIR="~/calories_cut_project"
            REPO_URL="https://github.com/${{ github.repository }}.git"
           
            if [ -d "$PROJECT_DIR" ]; then
              echo "Project directory exists. Pulling latest changes..."
              cd "$PROJECT_DIR"
              git pull origin main
            else
              echo "Project directory not found. Cloning repository..."
              git clone "$REPO_URL" "$PROJECT_DIR"
              cd "$PROJECT_DIR"
            fi
            
            # 3-2. Maven build
            echo "Building project with Maven..."
            mvn clean package -DskipTests
            echo "Build completed in VM"
            
            # 3-3. send file to pi and restart PM2
            echo "Transferring and restarting on Raspberry Pi..."
            
            eval "$(ssh-agent -s)" > /dev/null
            ssh-add ~/.ssh/github_actions_pi
            
            # Through SCP, send WAR file to pi from VM
            scp -o StrictHostKeyChecking=no target/healthML.war \
            pi@ssh.wadeverse.net:~/healthML.war 

            ssh pi@ssh.wadeverse.net "pm2 restart healthML" 
            
            echo "Deployment to Raspberry Pi completed successfully!"
          EOF